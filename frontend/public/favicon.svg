    <path d="M298,188 Q328,212 332,238" stroke="#f5f0eb" stroke-width="10" fill="none" />
    <circle cx="360" cy="272" r="15" fill="#f5f0eb" />
    <path d="M304,188 Q348,230 360,272" stroke="#f5f0eb" stroke-width="10" fill="none" />

