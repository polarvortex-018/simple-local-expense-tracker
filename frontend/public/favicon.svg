    <!-- Currency Symbol (Rich Deep Purple Lavender #6b21a8) -->
    <text x="228" y="392" font-family="system-ui, -apple-system, sans-serif" font-size="100" font-weight="900" fill="#6b21a8" text-anchor="middle">₹</text>
